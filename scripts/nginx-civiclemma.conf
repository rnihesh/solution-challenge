# CivicLemma production nginx config
# Corrected to avoid redirect loops.
#
# Service ports on host:
# - Client (Next.js): 4000
# - Server (Express API): 4001
# - ML (FastAPI): 8000
# - Agent (FastAPI): 8001

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Main public domain HTTPS app proxy
server {
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    server_name lemma.niheshr.com;

    ssl_certificate /etc/letsencrypt/live/lemma.niheshr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemma.niheshr.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Increased for image/audio uploads
    client_max_body_size 100m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:4001;
    }

    location /ml/ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        rewrite ^/ml/?(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
    }

    location /agent/ {
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:8001;
    }

    location / {
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:4000;
    }
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name lemma.niheshr.com back-lemma.niheshr.com ml-lemma.niheshr.com agent-lemma.niheshr.com;
    return 301 https://$host$request_uri;
}
